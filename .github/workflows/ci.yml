name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Upgrade Python packaging tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0"
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: ruff check services/api
      - run: ruff format --check services/api
      - run: mypy --strict services/api/app
      - run: python -m pytest services/api

  web:
    name: Web tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build

  containers:
    name: Container builds and smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the standard Compose image
        run: docker compose up --build --detach --wait --wait-timeout 180 analyzer
      - name: Build and start the Vercel-targeted image
        run: docker compose --profile vercel up --build --detach --wait --wait-timeout 180 analyzer-vercel
      - name: Smoke-test both containers
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          for base_url in ("http://localhost:8000", "http://localhost:8001"):
              with urlopen(f"{base_url}/healthz", timeout=5) as response:
                  assert response.status == 200
              with urlopen(f"{base_url}/api/docs", timeout=5) as response:
                  assert response.status == 200
              with urlopen(f"{base_url}/api/v1/factors?limit=1", timeout=5) as response:
                  catalog = json.load(response)
              assert catalog["total_records"] == 302
              payload = json.dumps({
                  "processes": [{"factor_id": catalog["factors"][0]["id"], "quantity": 0.18}]
              }).encode()
              request = Request(
                  f"{base_url}/api/v1/process-estimates",
                  data=payload,
                  headers={"Content-Type": "application/json"},
              )
              with urlopen(request, timeout=10) as response:
                  estimate = json.load(response)
              assert len(estimate["results"][0]["indicators"]) == 16
              assert estimate["license_url"] == "https://creativecommons.org/licenses/by-sa/4.0/"
          PY
      - name: Stop containers
        if: always()
        run: docker compose --profile vercel down --volumes
