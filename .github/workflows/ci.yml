name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Upgrade Python packaging tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0"
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: ruff check services/api
      - run: ruff format --check services/api
      - run: mypy --strict services/api/app
      - run: python -m pytest services/api

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
