<!doctype html>
<!--
  EcoImpact Lab: marketing site (single file).

  Structure
  - Four pages in one document, routed by the URL hash: #/ (home), #/method, #/pricing, #/contact.
  - React 18 and JSX are loaded from pinned CDN builds; JSX is compiled in the browser by Babel standalone.
    For high-traffic production, precompile the script with the Babel CLI and drop the Babel tag.
  - All visual settings are CSS custom properties in :root.

  Content that must be checked before launch
  - Pricing amounts, the contact email, the social profile URLs, and the office address are placeholders.
  - The testimonials are sample quotes and must be replaced with approved customer quotes.
  - The contact and newsletter forms only deliver when CONFIG.formEndpoint is set (see the CONFIG block).
-->
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>document.documentElement.classList.replace('no-js', 'js');</script>

  <!-- SEO -->
  <title>EcoImpact Lab | Environmental Impact Analyzer for apparel and footwear</title>
  <meta name="description" content="EcoImpact Lab estimates the environmental impact of apparel and footwear processes. Keep all 16 EF 3.1 indicators per process, subtotal selected rows, and see the single score for those rows." />
  <meta name="keywords" content="environmental impact analyzer, EF 3.1, product environmental footprint, apparel LCA, footwear LCA, life cycle assessment, carbon footprint calculator" />
  <meta name="author" content="EcoImpact Lab" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.ecoimpact-lab.example/" />
  <meta name="theme-color" content="#164535" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EcoImpact Lab" />
  <meta property="og:title" content="EcoImpact Lab | Environmental Impact Analyzer" />
  <meta property="og:description" content="Measure the impact behind every apparel and footwear process, with all 16 EF 3.1 indicators kept per row." />
  <meta property="og:url" content="https://www.ecoimpact-lab.example/" />
  <meta property="og:image" content="https://picsum.photos/seed/ecoimpact-valley/1200/630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EcoImpact Lab | Environmental Impact Analyzer" />
  <meta name="twitter:description" content="All 16 EF 3.1 indicators per process, with honest scope notes." />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "EcoImpact Lab",
        "url": "https://www.ecoimpact-lab.example/",
        "logo": "https://www.ecoimpact-lab.example/logo.png",
        "address": { "@type": "PostalAddress", "addressLocality": "Hyderabad", "addressRegion": "Telangana", "addressCountry": "IN" }
      },
      {
        "@type": "SoftwareApplication",
        "name": "EcoImpact Lab Environmental Impact Analyzer",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any modern web browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "description": "Browser-based estimator for apparel and footwear process factors, with 16 EF 3.1 indicators per process row."
      }
    ]
  }
  </script>

  <!-- Fonts and icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* ------------------------------------------------------------------
       1. Design tokens
       ------------------------------------------------------------------ */
    :root {
      --ink: #13231f;
      --ink-soft: #3b4f49;
      --paper: #fbfaf5;
      --mist: #eef4ef;
      --line: #d7e2da;
      --forest: #164535;
      --forest-2: #1f5c48;
      --forest-ink: #e9f5ee;
      --forest-muted: #bfd8c9;
      --leaf: #6fcf97;
      --leaf-soft: #cbf2d9;
      --focus: #0b6bcb;
      --danger: #b42318;

      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --section-y: clamp(64px, 9vw, 112px);
      --container: 1180px;
      --gutter: clamp(20px, 4vw, 40px);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(19, 35, 31, 0.08);
      --shadow-md: 0 14px 34px rgba(19, 35, 31, 0.12);
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --speed: 380ms;
      --header-h: 68px;
    }

    /* ------------------------------------------------------------------
       2. Base and reset
       ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--paper);
      overflow-x: hidden;
    }
    img, svg, canvas { display: block; max-width: 100%; }
    h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; letter-spacing: -0.01em; margin: 0 0 var(--space-4); }
    h1 { font-size: clamp(2.3rem, 5.4vw, 4.1rem); font-weight: 700; }
    h2 { font-size: clamp(1.8rem, 3.6vw, 2.8rem); font-weight: 700; }
    h3 { font-size: 1.25rem; font-weight: 600; }
    p { margin: 0 0 var(--space-4); }
    a { color: var(--forest-2); text-underline-offset: 3px; }
    a:hover { color: var(--forest); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
    .container { width: min(100% - (var(--gutter) * 2), var(--container)); margin-inline: auto; }
    .section { padding-block: var(--section-y); position: relative; overflow: hidden; }
    .section-alt { background: var(--mist); }
    .section-dark { background: var(--forest); color: var(--forest-ink); }
    .section-dark h2, .section-dark h3 { color: #ffffff; }
    .section-dark p { color: var(--forest-muted); }
    .eyebrow {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--forest-2); margin-bottom: var(--space-4);
    }
    .section-dark .eyebrow { color: var(--leaf-soft); }
    .lede { font-size: 1.18rem; color: var(--ink-soft); max-width: 60ch; }
    .section-dark .lede { color: var(--forest-muted); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; left: var(--space-4); top: -60px; z-index: 100;
      background: var(--forest); color: #fff; padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm);
      transition: top var(--speed) var(--ease);
    }
    .skip-link:focus { top: var(--space-4); }

    /* ------------------------------------------------------------------
       3. Buttons and links
       ------------------------------------------------------------------ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      min-height: 48px; padding: 0 var(--space-5); border-radius: 999px;
      border: 1px solid transparent; font: inherit; font-weight: 600; font-size: 1rem;
      text-decoration: none; cursor: pointer;
      transition: background var(--speed) var(--ease), color var(--speed) var(--ease), transform var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--forest); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--forest-2); color: #fff; box-shadow: var(--shadow-md); }
    .btn-leaf { background: var(--leaf); color: var(--ink); }
    .btn-leaf:hover { background: var(--leaf-soft); color: var(--ink); }
    .btn-outline { background: transparent; color: var(--forest); border-color: var(--forest); }
    .btn-outline:hover { background: var(--forest); color: #fff; }
    .btn-ghost-light { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.5); }
    .btn-ghost-light:hover { background: #fff; color: var(--forest); }
    .btn[disabled] { opacity: 0.6; cursor: not-allowed; transform: none; }
    .link-arrow { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; text-decoration: none; }
    .link-arrow i { transition: transform var(--speed) var(--ease); }
    .link-arrow:hover i { transform: translateX(4px); }

    /* ------------------------------------------------------------------
       4. Header and hamburger menu (the only navigation control)
       ------------------------------------------------------------------ */
    .site-header {
      position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--header-h);
      background: rgba(251, 250, 245, 0.86); backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color var(--speed) var(--ease), background var(--speed) var(--ease);
    }
    .site-header.is-scrolled { border-bottom-color: var(--line); background: rgba(251, 250, 245, 0.96); }
    .site-header .container { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: var(--space-3); color: var(--ink); text-decoration: none; font-weight: 700; }
    .brand:hover { color: var(--ink); }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      background: linear-gradient(135deg, var(--forest-2), var(--leaf)); color: #fff; font-size: 1.05rem;
      transition: transform var(--speed) var(--ease);
    }
    .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.05); }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-text strong { font-size: 1.05rem; font-family: var(--font-display); }
    .brand-text span { font-size: 0.72rem; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.02em; }

    .menu-button {
      width: 48px; height: 48px; display: grid; place-items: center; gap: 0;
      border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink);
      cursor: pointer; font-size: 1.1rem; transition: border-color var(--speed) var(--ease), transform var(--speed) var(--ease);
    }
    .menu-button:hover { border-color: var(--forest-2); transform: translateY(-1px); }
    .menu-button .fa-solid { transition: transform var(--speed) var(--ease); }
    .menu-button[aria-expanded="true"] .fa-solid { transform: rotate(90deg); }

    /* Full-screen menu overlay */
    .menu {
      position: fixed; inset: 0; z-index: 60; background: var(--forest); color: var(--forest-ink);
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity var(--speed) var(--ease), visibility var(--speed) var(--ease);
    }
    .menu.is-open { opacity: 1; visibility: visible; }
    .menu-inner { width: min(100% - 40px, 760px); margin-inline: auto; display: grid; grid-template-columns: 1fr; gap: var(--space-6); }
    .menu-close {
      position: absolute; top: 16px; right: 20px; width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 14px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 1.1rem; cursor: pointer;
    }
    .menu-close:hover { background: rgba(255, 255, 255, 0.12); }
    .menu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
    .menu-list a {
      display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-3) 0;
      color: #fff; text-decoration: none; font-family: var(--font-display); font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      transform: translateY(12px); opacity: 0; transition: transform 500ms var(--ease), opacity 500ms var(--ease), color var(--speed) var(--ease), padding var(--speed) var(--ease);
    }
    .menu.is-open .menu-list a { transform: none; opacity: 1; }
    .menu.is-open .menu-list li:nth-child(2) a { transition-delay: 60ms; }
    .menu.is-open .menu-list li:nth-child(3) a { transition-delay: 120ms; }
    .menu.is-open .menu-list li:nth-child(4) a { transition-delay: 180ms; }
    .menu.is-open .menu-list li:nth-child(5) a { transition-delay: 240ms; }
    .menu-list a:hover, .menu-list a[aria-current="page"] { color: var(--leaf-soft); padding-left: var(--space-3); }
    .menu-list small { font-family: var(--font-body); font-size: 0.85rem; color: var(--forest-muted); font-weight: 500; }
    .menu-foot { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; }
    .menu-social { display: flex; gap: var(--space-3); }
    .menu-social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
    .menu-social a:hover { background: #fff; color: var(--forest); }

    /* ------------------------------------------------------------------
       5. Hero (canvas particles, layered parallax)
       ------------------------------------------------------------------ */
    .hero {
      min-height: 100svh; padding-top: calc(var(--header-h) + 40px); padding-bottom: 72px;
      display: flex; align-items: center; background: #0f2a21; color: var(--forest-ink);
      isolation: isolate;
    }
    .hero-layer { position: absolute; inset: 0; pointer-events: none; }
    .hero-photo { position: absolute; inset: -8% 0; width: 100%; height: 116%; object-fit: cover; opacity: 0.38; filter: saturate(0.85); }
    .hero-glow {
      background:
        radial-gradient(60% 50% at 80% 20%, rgba(111, 207, 151, 0.28), transparent 70%),
        radial-gradient(50% 45% at 10% 90%, rgba(31, 92, 72, 0.6), transparent 70%),
        linear-gradient(180deg, rgba(15, 42, 33, 0.35), rgba(15, 42, 33, 0.92));
    }
    .hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero .container { position: relative; z-index: 2; }
    .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: var(--space-7); align-items: center; }
    .hero h1 { color: #fff; }
    .hero h1 em { font-style: normal; color: var(--leaf); }
    .hero .lede { color: var(--forest-muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }
    .hero-proof { display: flex; flex-wrap: wrap; gap: var(--space-5); margin-top: var(--space-6); font-size: 0.92rem; color: var(--forest-muted); }
    .hero-proof span { display: inline-flex; align-items: center; gap: var(--space-2); }
    .hero-proof i { color: var(--leaf); }
    .hero-card {
      background: rgba(251, 250, 245, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-lg); padding: var(--space-5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
    }
    .hero-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-4); color: #fff; }
    .hero-card-head strong { font-family: var(--font-display); font-size: 1.1rem; }
    .hero-card-head span { font-size: 0.8rem; color: var(--forest-muted); }
    .indicator-row { display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); padding: 9px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.93rem; color: var(--forest-ink); }
    .indicator-row b { font-variant-numeric: tabular-nums; color: #fff; }
    .indicator-bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    .indicator-bar span { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--forest-2), var(--leaf)); border-radius: 6px; transition: width 1.2s var(--ease); }
    .js .hero-card .indicator-bar span { width: 0; }
    .js .is-visible .indicator-bar span, .no-js .indicator-bar span { width: var(--w); }
    .hero-card-foot { margin-top: var(--space-4); font-size: 0.8rem; color: var(--forest-muted); }
    .scroll-cue {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2;
      display: grid; justify-items: center; gap: 4px; color: #cfe9dc; font: inherit; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
      background: none; border: 0; padding: 4px 8px; cursor: pointer;
    }
    .scroll-cue i { animation: bob 2.2s var(--ease) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* Layered parallax frames (depth set by data-depth, applied in JS) */
    .parallax-frame { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .parallax-frame img { position: absolute; left: 0; top: -10%; width: 100%; height: 120%; object-fit: cover; will-change: transform; }

    /* ------------------------------------------------------------------
       6. Scroll reveal (only when JavaScript runs)
       ------------------------------------------------------------------ */
    .js .reveal { opacity: 0; transform: translateY(26px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); transition-delay: var(--delay, 0ms); }
    .js .reveal.is-visible { opacity: 1; transform: none; }

    /* ------------------------------------------------------------------
       7. Stats
       ------------------------------------------------------------------ */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5); margin: 0; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5); box-shadow: var(--shadow-sm); }
    .stat dt { order: 2; color: var(--ink-soft); font-size: 0.95rem; margin-top: var(--space-2); }
    .stat dd { margin: 0; order: 1; }
    .stat { display: flex; flex-direction: column; }
    .stat-value { font-family: var(--font-display); font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 700; color: var(--forest); font-variant-numeric: tabular-nums; line-height: 1; }

    /* ------------------------------------------------------------------
       8. Alternating feature rows (left/right)
       ------------------------------------------------------------------ */
    .feature { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 80px); align-items: center; }
    .feature + .feature { margin-top: var(--section-y); }
    .feature.is-reversed .feature-media { order: 2; }
    .feature-media { position: relative; border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4 / 3; box-shadow: var(--shadow-md); background: var(--mist); }
    .feature-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 900ms var(--ease); }
    .feature-media:hover img { transform: scale(1.04); }
    .feature-copy .lede { margin-bottom: var(--space-5); }
    .checklist { list-style: none; padding: 0; margin: 0 0 var(--space-5); display: grid; gap: var(--space-3); }
    .checklist li { display: grid; grid-template-columns: 24px 1fr; gap: var(--space-3); color: var(--ink-soft); }
    .checklist i { color: var(--forest-2); margin-top: 5px; }

    /* ------------------------------------------------------------------
       9. Testimonial carousel
       ------------------------------------------------------------------ */
    .carousel { position: relative; max-width: 860px; margin-inline: auto; }
    .carousel-viewport { overflow: hidden; border-radius: var(--radius-lg); }
    .carousel-track { display: flex; transition: transform 650ms var(--ease); }
    .carousel-slide { flex: 0 0 100%; padding: clamp(28px, 5vw, 56px); background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .quote-mark { font-size: 2rem; color: var(--leaf); margin-bottom: var(--space-3); }
    .quote-text { font-family: var(--font-display); font-size: clamp(1.25rem, 2.4vw, 1.6rem); line-height: 1.4; color: var(--ink); margin-bottom: var(--space-5); }
    .quote-person { display: flex; align-items: center; gap: var(--space-3); }
    .quote-person img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
    .quote-person strong { display: block; }
    .quote-person span { color: var(--ink-soft); font-size: 0.92rem; }
    .carousel-controls { display: flex; align-items: center; justify-content: center; gap: var(--space-4); margin-top: var(--space-5); }
    .carousel-btn {
      width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--forest);
      display: grid; place-items: center; cursor: pointer; transition: background var(--speed) var(--ease), color var(--speed) var(--ease), border-color var(--speed) var(--ease);
    }
    .carousel-btn:hover { background: var(--forest); color: #fff; border-color: var(--forest); }
    .carousel-dots { display: flex; gap: var(--space-2); }
    .carousel-dot { width: 12px; height: 12px; border-radius: 999px; border: 0; padding: 0; background: #b9cabf; cursor: pointer; transition: width var(--speed) var(--ease), background var(--speed) var(--ease); }
    .carousel-dot[aria-selected="true"] { width: 32px; background: var(--forest-2); }
    .carousel-dot { min-width: 12px; min-height: 12px; }

    /* ------------------------------------------------------------------
       10. Page hero (inner pages)
       ------------------------------------------------------------------ */
    .page-hero { padding-top: calc(var(--header-h) + 64px); padding-bottom: 64px; background: linear-gradient(180deg, var(--mist), var(--paper)); position: relative; overflow: hidden; }
    .page-hero .container { position: relative; z-index: 2; }
    .page-hero .lede { max-width: 56ch; }
    .page-hero-orb { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(111, 207, 151, 0.35), transparent 65%); right: -140px; top: -120px; }

    /* Journey steps for the method page */
    .steps { display: grid; gap: var(--section-y); }
    .step-number { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; color: var(--forest-2); letter-spacing: 0.08em; margin-bottom: var(--space-2); }

    /* Scope table */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--line); background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 0.95rem; }
    th { background: var(--mist); color: var(--forest); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }

  function pageFromHash() {

  /** Scrolls smoothly to an element (or the top), honouring reduced motion. */
  function scrollToTarget(target) {
    const behavior = REDUCED_MOTION ? 'auto' : 'smooth';
    if (target === 'top') {
      window.scrollTo({ top: 0, behavior });
      return;
    }
    const element = typeof target === 'string' ? document.getElementById(target) : target;
    if (element) element.scrollIntoView({ behavior, block: 'start' });

  /* ----------------------------------------------------------------
     Hooks: scroll reveal, parallax layers, scroll state, metadata
     ---------------------------------------------------------------- */

  /** Adds .is-visible to .reveal elements as they enter the viewport. */
  function useReveal(deps) {
    useEffect(() => {
      const elements = document.querySelectorAll('.reveal:not(.is-visible)');
      if (REDUCED_MOTION || !('IntersectionObserver' in window)) {
        elements.forEach((el) => el.classList.add('is-visible'));
        return undefined;
      }
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.15, rootMargin: '0px 0px -40px 0px' },
      );
      elements.forEach((el) => observer.observe(el));
      return () => observer.disconnect();
    }, deps);
  }

  /**
   * Parallax layers: every element with data-depth moves by (distance from viewport centre x depth).
   * The image sits in an overflow-hidden frame, and the offset is clamped so no gap shows.
   */
  function useParallax(deps) {
    useEffect(() => {
      if (REDUCED_MOTION) return undefined;
      let frame = 0;
      const update = () => {
        frame = 0;
        const viewport = window.innerHeight;
        document.querySelectorAll('[data-depth]').forEach((el) => {
          const box = el.parentElement.getBoundingClientRect();
          if (box.bottom < -200 || box.top > viewport + 200) return;
          const centre = box.top + box.height / 2 - viewport / 2;
          const depth = parseFloat(el.dataset.depth);
          const offset = Math.max(-40, Math.min(40, -centre * depth));
          el.style.transform = `translate3d(0, ${offset.toFixed(1)}px, 0)`;
        });
      };
      const onScroll = () => {
        if (!frame) frame = requestAnimationFrame(update);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      update();
      return () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onScroll);
        if (frame) cancelAnimationFrame(frame);
      };
    }, deps);
  }

  /** Tracks scroll position as a boolean threshold, for the header and floating buttons. */
  function useScrolledPast(threshold) {
    const [past, setPast] = useState(false);
    useEffect(() => {
      let frame = 0;
      const update = () => {
        frame = 0;
        setPast(window.scrollY > threshold);
      };
      const onScroll = () => {
        if (!frame) frame = requestAnimationFrame(update);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      update();
      return () => {
        window.removeEventListener('scroll', onScroll);
        if (frame) cancelAnimationFrame(frame);
      };
    }, [threshold]);
    return past;
  }

  }

  /* ----------------------------------------------------------------
     Canvas hero: particle network that reacts to the pointer.
     Pauses when offscreen; draws one still frame under reduced motion.
     ---------------------------------------------------------------- */
  function ParticleCanvas() {
    const canvasRef = useRef(null);

    useEffect(() => {
      const canvas = canvasRef.current;
      if (!canvas) return undefined;
      const ctx = canvas.getContext('2d');
      const parent = canvas.parentElement;
      let width = 0;
      let height = 0;
      let particles = [];
      let frame = 0;
      let visible = true;
      const pointer = { x: -9999, y: -9999 };

      const resize = () => {
        const box = parent.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = box.width;
        height = box.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(80, Math.floor((width * height) / 18000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: 1 + Math.random() * 1.6,
        }));
        draw(false);
      };

      /** Draws one frame. Moves particles only when animating. */
      const draw = (animate) => {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          if (animate) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;
            const dx = p.x - pointer.x;
            const dy = p.y - pointer.y;
            const distance = Math.hypot(dx, dy);
            if (distance < 110) {
              p.x += (dx / distance) * 1.4;
              p.y += (dy / distance) * 1.4;
            }
          }
        });
        for (let i = 0; i < particles.length; i += 1) {
          for (let j = i + 1; j < particles.length; j += 1) {
            const a = particles[i];
            const b = particles[j];
            const distance = Math.hypot(a.x - b.x, a.y - b.y);
            if (distance < 120) {
              ctx.strokeStyle = `rgba(111, 207, 151, ${((1 - distance / 120) * 0.32).toFixed(3)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        ctx.fillStyle = 'rgba(203, 242, 217, 0.85)';
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
      };

      const loop = () => {
        if (!visible) {
          frame = 0;
          return;
        }
        draw(true);
        frame = requestAnimationFrame(loop);
      };

      const onPointer = (event) => {
        const box = canvas.getBoundingClientRect();
        pointer.x = event.clientX - box.left;
        pointer.y = event.clientY - box.top;
      };
      const onLeave = () => {
        pointer.x = -9999;
        pointer.y = -9999;
      };

      let resizeTimer = 0;
      const onResize = () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resize, 120);
      };

      resize();
      if (!REDUCED_MOTION) {
        frame = requestAnimationFrame(loop);
        parent.addEventListener('pointermove', onPointer);
        parent.addEventListener('pointerleave', onLeave);
      }
      window.addEventListener('resize', onResize);

      const observer = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        if (visible && !REDUCED_MOTION && !frame) frame = requestAnimationFrame(loop);
      });
      observer.observe(canvas);

      return () => {
        cancelAnimationFrame(frame);
        window.clearTimeout(resizeTimer);
        window.removeEventListener('resize', onResize);
        parent.removeEventListener('pointermove', onPointer);
        parent.removeEventListener('pointerleave', onLeave);
        observer.disconnect();
      };
    }, []);

    return <canvas ref={canvasRef} className="hero-canvas" aria-hidden="true" />;
  }

  /** Animated number that counts up once when it scrolls into view. */
  function Counter({ to, suffix = '', label }) {
    const ref = useRef(null);
    const [value, setValue] = useState(REDUCED_MOTION ? to : 0);

    useEffect(() => {
      if (REDUCED_MOTION) return undefined;
      const element = ref.current;
      let started = false;
      const observer = new IntersectionObserver(
        ([entry]) => {
          if (!entry.isIntersecting || started) return;
          started = true;
          observer.disconnect();
          const start = performance.now();
          const duration = 1600;
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setValue(Math.round(to * eased));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        },
        { threshold: 0.5 },
      );
      observer.observe(element);
      return () => observer.disconnect();
    }, [to]);

    return (
      <div className="stat reveal" ref={ref}>
        <dt>{label}</dt>
        <dd>
          <span className="stat-value">{value.toLocaleString('en-IN')}{suffix}</span>
        </dd>
      </div>
    );
  }

  /**
   * Validation rules, kept as plain data so they can be tested.
   * Returns an object of field -> message. An empty object means valid.
   */
  function validateContact(values) {
    const errors = {};
    const name = values.name.trim();
    if (name.length < 2) errors.name = 'Enter your name (at least 2 characters).';
    if (!EMAIL_PATTERN.test(values.email.trim())) errors.email = 'Enter an email address such as name@company.com.';
    if (values.company.trim().length > 100) errors.company = 'Keep the company name under 100 characters.';
    if (!values.topic) errors.topic = 'Choose the topic closest to your question.';
    const message = values.message.trim();
    if (message.length < 20) errors.message = `Add a little more detail (${20 - message.length} more characters).`;
    if (message.length > 1000) errors.message = 'Keep the message under 1,000 characters.';
    return errors;
  }

  /** Sends JSON when an endpoint is configured. Resolves with 'sent' or 'unavailable'. */
  async function submitJson(payload) {
    if (!CONFIG.formEndpoint) return 'unavailable';
    const response = await fetch(CONFIG.formEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
    return 'sent';
  }

  function FieldError({ id, message }) {
    if (!message) return null;
    return (
      <p id={id} className="field-error" role="alert">
        <i className="fa-solid fa-circle-exclamation" aria-hidden="true" />
        <span>{message}</span>
      </p>
    );
  }

  /** Contact form with live validation after the first submit, an error summary, and a honeypot. */
  function ContactForm() {
    const [values, setValues] = useState({ name: '', email: '', company: '', topic: '', message: '', website: '' });
    const [errors, setErrors] = useState({});
    const [submitted, setSubmitted] = useState(false);
    const [status, setStatus] = useState({ state: 'idle', text: '' });
    const summaryRef = useRef(null);

    const update = (field) => (event) => {
      const next = { ...values, [field]: event.target.value };
      setValues(next);
      if (submitted) setErrors(validateContact(next));
    };

    const onSubmit = async (event) => {
      event.preventDefault();
      setSubmitted(true);
      // The honeypot field is hidden from people. A filled value means a bot, so we report success and send nothing.
      if (values.website) {
        setStatus({ state: 'ok', text: 'Thanks. Your message is with the team.' });
        return;
      }
      const found = validateContact(values);
      setErrors(found);
      if (Object.keys(found).length > 0) {
        window.setTimeout(() => summaryRef.current && summaryRef.current.focus(), 0);
        return;
      }
      setStatus({ state: 'sending', text: 'Sending your message…' });
      try {
        const result = await submitJson({
          name: values.name.trim(),
          email: values.email.trim(),
          company: values.company.trim(),
          topic: values.topic,
          message: values.message.trim(),
          source: 'contact',
        });
        if (result === 'sent') {
          setStatus({ state: 'ok', text: 'Thanks. We have your message and will reply within two working days.' });
          setValues({ name: '', email: '', company: '', topic: '', message: '', website: '' });
          setSubmitted(false);
          setErrors({});
        } else {
          setStatus({
            state: 'warn',
            text: 'Online delivery is not connected yet. Please email us at',

        setStatus({ state: 'error', text: 'We could not send your message. Please try again, or email us directly.' });

  /** Newsletter subscription used in the footer. */
  function NewsletterForm() {
    const [email, setEmail] = useState('');
    const [consent, setConsent] = useState(false);
    const [error, setError] = useState('');
    const [status, setStatus] = useState({ state: 'idle', text: '' });

    const onSubmit = async (event) => {
      event.preventDefault();
      if (!EMAIL_PATTERN.test(email.trim())) {
        setError('Enter an email address such as name@company.com.');
        return;
      }
      if (!consent) {
        setError('Tick the box so we know you agree to receive updates.');
        return;
      }
      setError('');
      setStatus({ state: 'sending', text: 'Subscribing…' });
      try {
        const result = await submitJson({ email: email.trim(), consent: true, source: 'newsletter' });
        if (result === 'sent') {
          setStatus({ state: 'ok', text: 'You are subscribed. Check your inbox to confirm.' });
          setEmail('');
          setConsent(false);
        } else {
          setStatus({ state: 'warn', text: 'Sign-up is not connected yet. Email us to subscribe.' });
        }
      } catch {
        setStatus({ state: 'error', text: 'We could not subscribe you. Please try again.' });
      }
    };

    return (
      <form className="newsletter" onSubmit={onSubmit} noValidate aria-labelledby="newsletter-title">
        <h2 id="newsletter-title">Method updates, once a month</h2>
        <p style={{ color: 'var(--forest-muted)', fontSize: '0.95rem' }}>New factor versions, method notes, and scope changes. Nothing else.</p>

        </label>

        <div role="status" aria-live="polite">
          {status.state !== 'idle' && status.state !== 'sending' && (
            <div className={`form-status is-${status.state === 'ok' ? 'ok' : status.state === 'warn' ? 'warn' : 'error'}`}>{status.text}</div>

  /** Full-screen menu. Focus moves into it on open, Escape closes it, and focus returns to the toggle. */
  function MenuOverlay({ open, page, onClose }) {
    const firstLinkRef = useRef(null);

    useEffect(() => {
      if (!open) return undefined;
      const previous = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      // The menu fades in, and an element cannot take focus while it is hidden.
      // Retry briefly until the first link accepts focus.
      let attempts = 0;
      let focusTimer = null;
      const tryFocus = () => {
        const link = firstLinkRef.current;
        if (link) link.focus();
        attempts += 1;
        if ((!link || document.activeElement !== link) && attempts < 100) {
          focusTimer = window.setTimeout(tryFocus, 50);
        }
      };
      focusTimer = window.setTimeout(tryFocus, 80);
      const onKey = (event) => {
        if (event.key === 'Escape') onClose();
        if (event.key === 'Tab') {
          // Keep focus inside the menu while it is open.
          const focusable = Array.from(document.querySelectorAll('#site-menu a, #site-menu button'));
          if (focusable.length === 0) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      };
      document.addEventListener('keydown', onKey);
      return () => {
        window.clearTimeout(focusTimer);
        document.removeEventListener('keydown', onKey);
        document.body.style.overflow = previous;
      };
    }, [open, onClose]);

    return (
      <div id="site-menu" className={`menu${open ? ' is-open' : ''}`} role="dialog" aria-modal="true" aria-label="Site menu" aria-hidden={!open}>
        <button type="button" className="menu-close" onClick={onClose} aria-label="Close menu">
          <i className="fa-solid fa-xmark" aria-hidden="true" />
        </button>
        <div className="menu-inner">
          <nav aria-label="Primary">
            <ul className="menu-list">
              {PAGES.map((item, i) => (
                <li key={item.id}>
                  <a
                    href={`#${item.path}`}
                    ref={i === 0 ? firstLinkRef : undefined}
                    aria-current={page === item.id ? 'page' : undefined}
                    onClick={onClose}
                  >
                    <small aria-hidden="true">0{i + 1}</small>
                    {item.label}
                    <small className="sr-only">, {item.hint}</small>
                  </a>
                </li>
              ))}
              <li>
                <a href={CONFIG.calculatorUrl} target="_blank" rel="noopener noreferrer" onClick={onClose}>
                  <small aria-hidden="true">05</small>
                  Calculator
                  <small className="sr-only">, opens in a new tab</small>
                </a>
              </li>
            </ul>
          </nav>
          <div className="menu-foot">
            <div className="menu-social">
              {SOCIAL.map((item) => (
                <a key={item.label} href={item.href} target="_blank" rel="noopener noreferrer" aria-label={item.label}>
                  <i className={item.icon} aria-hidden="true" />
                </a>
              ))}
            </div>
            <a href={`mailto:${CONFIG.contactEmail}`} style={{ color: 'var(--forest-muted)' }}>{CONFIG.contactEmail}</a>
          </div>
        </div>
      </div>
    );
  }

  function StickyCta({ page }) {
    const scrolled = useScrolledPast(520);

    useEffect(() => {
      const onScroll = () => {
        const remaining = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
        setNearEnd(remaining < 320);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      return () => window.removeEventListener('scroll', onScroll);

    return (
      <a className={`sticky-cta${visible ? ' is-visible' : ''}`} href={CONFIG.calculatorUrl} target="_blank" rel="noopener noreferrer" aria-hidden={!visible} tabIndex={visible ? 0 : -1}>

    );

                    className={`btn ${plan.featured ? 'btn-primary' : 'btn-outline'}`}

                    {plan.cta}

                </article>
              ))}
            </div>
            <p className="reveal" style={{ textAlign: 'center', marginTop: 'var(--space-6)', color: 'var(--ink-soft)', fontSize: '0.92rem' }}>
              Prices exclude applicable taxes. Team pricing is billed monthly in Indian rupees.

        <section className="section section-alt" aria-labelledby="faq-title">

      </main>

  }

  /* ----------------------------------------------------------------
     App: wires the route, the menu, and the page-level effects.
     ---------------------------------------------------------------- */
  function App() {
    const page = useRoute();
    const [menuOpen, setMenuOpen] = useState(false);
    const closeMenu = useCallback(() => setMenuOpen(false), []);
    const toggleMenu = useCallback(() => setMenuOpen((open) => !open), []);
    const previousPage = useRef(page);

    usePageMeta(page);
    useReveal([page]);
    useParallax([page]);

    // On a page change: close the menu, scroll to the top, and move focus to the page heading.
    useEffect(() => {
      setMenuOpen(false);
      if (previousPage.current !== page) {
        scrollToTarget('top');
        const main = document.getElementById('main');
        if (main) main.focus({ preventScroll: true });
      }
      previousPage.current = page;
    }, [page]);

    // Closing the menu returns focus to its toggle, so keyboard users stay in place.
    const firstRender = useRef(true);
    useEffect(() => {
      if (firstRender.current) {
        firstRender.current = false;
        return;
      }
      if (!menuOpen) {
        const toggle = document.querySelector('.menu-button');
        if (toggle && document.activeElement && document.getElementById('site-menu')?.contains(document.activeElement)) toggle.focus();
      }
    }, [menuOpen]);

    let content;
    if (page === 'method') content = <MethodPage />;
    else if (page === 'pricing') content = <PricingPage />;
    else if (page === 'contact') content = <ContactPage />;
    else content = <HomePage />;

    return (
      <>
        <SiteHeader page={page} menuOpen={menuOpen} onOpenMenu={toggleMenu} />
        <MenuOverlay open={menuOpen} page={page} onClose={closeMenu} />
        {content}
        <SiteFooter />
        <StickyCta page={page} />
        <BackToTop />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
