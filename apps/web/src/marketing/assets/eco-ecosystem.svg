<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="auto" style="display:block;max-width:100%" role="presentation" aria-hidden="true" focusable="false">
  <!--
    EcoImpact Lab hero and feature visual.
    Three depth layers, back to front:
      1. Ambient: background gradient, grid, concentric rings, tick ring, terracotta boundary arc.
      2. Midground: leaf blueprint and the carbon-cycle flow network.
      3. Foreground: floating data points and glass callouts (stage names only, no impact values).
    All ids are prefixed so the SVG can sit beside other inline SVGs without collisions.
    Motion is defined in the <style> block below and is disabled under prefers-reduced-motion.
  -->
  <defs>
    <!-- Background surface: Deep Forest Charcoal to Dark Sage. -->
    <linearGradient id="eco-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1914"/>
      <stop offset="1" stop-color="#162A22"/>
    </linearGradient>

    <!-- Multi-stop glow for ambient and network nodes: bright core, emerald halo, transparent edge. -->
    <radialGradient id="eco-glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#80FFD5" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#00E699" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#00E699" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00E699" stop-opacity="0"/>
    </radialGradient>

    <!-- Terracotta glow reserved for the boundary accent. -->
    <radialGradient id="eco-glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E07A5F" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#E07A5F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft vignette that darkens the edges and keeps the eye on the centre. -->
    <radialGradient id="eco-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.5" stop-color="#0B1914" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1914" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Glow for accent paths: blur the source, then merge the blur under the crisp line. -->
    <filter id="svg-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Slow vertical float for foreground groups (y: -8px to 8px, 6s). */
    .eco-float { animation: float-slow 6s ease-in-out infinite; }
    .eco-float-delayed { animation: float-slow 6s ease-in-out -3s infinite; }
    /* Opacity pulse for data nodes (0.4 to 1.0, 3s). */
    .eco-pulse { animation: pulse-glow 3s ease-in-out infinite; }
    /* Dash offset travels along network pathways to show data flow. */
    .eco-flow { stroke-dasharray: 6 10; animation: line-flow 2.4s linear infinite; }

    @keyframes float-slow {
      0%, 100% { transform: translateY(-8px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes line-flow {
      to { stroke-dashoffset: -64; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eco-float, .eco-float-delayed, .eco-pulse, .eco-flow { animation: none; }
    }
  </style>

  <!-- ============ LAYER 1: AMBIENT (background grid and rings) ============ -->
  <g id="eco-layer-ambient">
    <rect width="800" height="600" fill="url(#eco-bg)"/>
    <rect width="800" height="600" fill="url(#eco-vignette)"/>

    <!-- Blueprint grid: dashed, 1px, 30% opacity, every 50 units. -->
    <path d="M50 0V600M100 0V600M150 0V600M200 0V600M250 0V600M300 0V600M350 0V600M400 0V600M450 0V600M500 0V600M550 0V600M600 0V600M650 0V600M700 0V600M750 0V600M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800M0 450H800M0 500H800M0 550H800"
          fill="none" stroke="#A3B18A" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

    <!-- Concentric metric rings around the central node. -->
    <circle cx="400" cy="300" r="120" fill="none" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
    <circle cx="400" cy="300" r="200" fill="none" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
    <circle cx="400" cy="300" r="280" fill="none" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>

    <!-- Outer tick ring: a dotted scale. -->
    <circle cx="400" cy="300" r="290" fill="none" stroke="#A3B18A" stroke-width="6" stroke-dasharray="1 9" opacity="0.35"/>

    <!-- Terracotta boundary arc: one quarter of the ring, marking the system boundary. -->
    <circle cx="400" cy="300" r="200" fill="none" stroke="#E07A5F" stroke-width="2" stroke-dasharray="140 1257" transform="rotate(-90 400 300)" opacity="0.6"/>
    <circle cx="400" cy="100" r="22" fill="url(#eco-glow-amber)"/>
  </g>

  <!-- ============ LAYER 2: MIDGROUND (leaf blueprint and flow network) ============ -->
  <g id="eco-layer-mid">
    <!-- Leaf blueprint: outline, midrib, and side veins built from cubic beziers. -->
    <g class="eco-float">
      <path d="M400 170 C 468 232 496 330 400 432 C 304 330 332 232 400 170 Z"
            fill="rgba(128, 255, 213, 0.04)" stroke="#80FFD5" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M400 178 C 402 260 398 350 400 424" fill="none" stroke="#80FFD5" stroke-opacity="0.6" stroke-width="1.5"/>
      <path d="M400 230 C 430 220 452 236 470 256 M400 230 C 370 220 348 236 330 256 M400 300 C 440 288 464 306 486 330 M400 300 C 360 288 336 306 314 330 M400 370 C 430 360 448 374 462 392 M400 370 C 370 360 352 374 338 392"
            fill="none" stroke="#80FFD5" stroke-opacity="0.4" stroke-width="1"/>
    </g>

    <!-- Carbon-cycle network: six nodes on the middle ring, joined by organic curves that carry the data flow. -->
    <g fill="none" stroke="#00E699" stroke-width="2" filter="url(#svg-glow)" stroke-linecap="round">
      <path class="eco-flow" d="M600 300 C 596 240 556 170 500 127"/>
      <path class="eco-flow" d="M500 127 C 440 160 360 160 300 127"/>
      <path class="eco-flow" d="M300 127 C 250 170 206 230 200 300"/>
      <path class="eco-flow" d="M200 300 C 206 370 250 430 300 473"/>
      <path class="eco-flow" d="M300 473 C 360 440 440 440 500 473"/>
      <path class="eco-flow" d="M500 473 C 556 430 596 360 600 300"/>
      <path class="eco-flow" d="M600 300 C 520 296 280 304 200 300" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g>
      <circle class="eco-pulse" cx="600" cy="300" r="18" fill="url(#eco-glow-core)"/>
      <circle class="eco-pulse" cx="500" cy="127" r="18" fill="url(#eco-glow-core)" style="animation-delay:-0.5s"/>
      <circle class="eco-pulse" cx="300" cy="127" r="18" fill="url(#eco-glow-core)" style="animation-delay:-1s"/>
      <circle class="eco-pulse" cx="200" cy="300" r="18" fill="url(#eco-glow-core)" style="animation-delay:-1.5s"/>
      <circle class="eco-pulse" cx="300" cy="473" r="18" fill="url(#eco-glow-core)" style="animation-delay:-2s"/>
      <circle class="eco-pulse" cx="500" cy="473" r="18" fill="url(#eco-glow-core)" style="animation-delay:-2.5s"/>
      <circle cx="600" cy="300" r="4.5" fill="#80FFD5"/>
      <circle cx="500" cy="127" r="4.5" fill="#80FFD5"/>
      <circle cx="300" cy="127" r="4.5" fill="#80FFD5"/>
      <circle cx="200" cy="300" r="4.5" fill="#80FFD5"/>
      <circle cx="300" cy="473" r="4.5" fill="#80FFD5"/>
      <circle cx="500" cy="473" r="4.5" fill="#80FFD5"/>
    </g>
  </g>

  <!-- ============ LAYER 3: FOREGROUND (floating data points and glass callouts) ============ -->
  <g id="eco-layer-fg">
    <!-- Floating data points: small glowing dots that drift and pulse. -->
    <g class="eco-float"><circle class="eco-pulse" cx="120" cy="180" r="2.5" fill="#80FFD5"/></g>
    <g class="eco-float-delayed"><circle class="eco-pulse" cx="680" cy="170" r="2.5" fill="#80FFD5"/></g>
    <g class="eco-float-delayed"><circle class="eco-pulse" cx="90" cy="420" r="2" fill="#00E699"/></g>
    <g class="eco-float"><circle class="eco-pulse" cx="710" cy="430" r="3" fill="#80FFD5"/></g>
    <g class="eco-float"><circle class="eco-pulse" cx="640" cy="90" r="2" fill="#00E699"/></g>
    <g class="eco-float-delayed"><circle class="eco-pulse" cx="160" cy="520" r="2.5" fill="#80FFD5"/></g>
    <g class="eco-float"><circle class="eco-pulse" cx="470" cy="560" r="2" fill="#E07A5F"/></g>
    <g class="eco-float-delayed"><circle class="eco-pulse" cx="330" cy="50" r="2.5" fill="#80FFD5"/></g>

    <!-- Glass callout: PROCESS. -->
    <g class="eco-float">
      <rect x="40" y="60" width="168" height="50" rx="12" fill="rgba(22, 42, 34, 0.6)" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
      <circle class="eco-pulse" cx="60" cy="85" r="4" fill="#80FFD5"/>
      <text x="76" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F4F7F6">PROCESS</text>
      <text x="76" y="97" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#A3B18A">Input stage</text>
    </g>

    <!-- Glass callout: BOUNDARY. -->
    <g class="eco-float-delayed">
      <rect x="592" y="60" width="168" height="50" rx="12" fill="rgba(22, 42, 34, 0.6)" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
      <circle class="eco-pulse" cx="612" cy="85" r="4" fill="#E07A5F"/>
      <text x="628" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F4F7F6">BOUNDARY</text>
      <text x="628" y="97" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#A3B18A">Scope shown</text>
    </g>

    <!-- Glass callout: CARBON CYCLE. -->
    <g class="eco-float-delayed">
      <rect x="40" y="490" width="168" height="50" rx="12" fill="rgba(22, 42, 34, 0.6)" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
      <circle class="eco-pulse" cx="60" cy="515" r="4" fill="#00E699"/>
      <text x="76" y="512" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F4F7F6">CARBON CYCLE</text>
      <text x="76" y="527" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#A3B18A">Flow network</text>
    </g>

    <!-- Glass callout: SUBTOTAL. -->
    <g class="eco-float">
      <rect x="592" y="490" width="168" height="50" rx="12" fill="rgba(22, 42, 34, 0.6)" stroke="rgba(128, 255, 213, 0.2)" stroke-width="1"/>
      <circle class="eco-pulse" cx="612" cy="515" r="4" fill="#80FFD5"/>
      <text x="628" y="512" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F4F7F6">SUBTOTAL</text>
      <text x="628" y="527" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#A3B18A">Selected rows</text>
    </g>
  </g>
</svg>
